# 프로젝트 목록. 새 프로젝트는 아래 형식으로 한 덩어리를 추가하면 카드가 생긴다.
#
# - id: 영문-소문자-이름          (겹치지 않게)
#   title: 화면에 보일 이름
#   emoji: 카드 아이콘 하나
#   role: 맡은 일 한 줄                 (없어도 된다)
#   summary: 한두 문장 설명
#   stats:                              (없어도 된다. 큰 숫자 두 개까지, 바뀌지 않는 측정값만)
#   visual: live-chart                  (숫자 대신 작은 시세 그림. CoinFloat용)
#     - { value: "99.0%", label: action accuracy }
#   category: app | ai | game | study   (위쪽 분류 버튼과 연결)
#   tags: [기술, 이름]
#   status: Live | In progress | Done | Coursework
#   featured: true                      (첫 화면 "Featured"에 보이기)
#   links:                              (비공개 저장소는 링크를 넣지 않는다)
#     - { label: Website, url: https://... }
#     - { label: GitHub, url: https://... }

