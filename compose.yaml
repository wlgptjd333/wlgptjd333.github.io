# 내 PC 미리 보기: docker compose up  →  http://127.0.0.1:4000
# 글이나 프로젝트를 고치면 자동으로 다시 만들어진다. 끄기: Ctrl+C
services:
  jekyll:
    image: ruby:3.3
    working_dir: /site
    command: sh -c "bundle install --quiet && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:35729:35729"
    volumes:
      - .:/site
      - bundle:/usr/local/bundle

volumes:
  bundle:
