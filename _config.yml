title: byhyesung
description: Hyesung's home hub — AI vision, apps, games, and notes
url: "https://byhyesung.com"
baseurl: ""
lang: en
timezone: Asia/Seoul

author:
  name: Hyesung
  github: wlgptjd333

permalink: /posts/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - compose.yaml
  - vendor
